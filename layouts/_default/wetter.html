{{ define "main" }}

<section class="sec page-head" aria-labelledby="wetter-h">
  <div class="wrap">
    <p class="eyebrow">{{ T "wx_eyebrow" }}</p>
    <h1 id="wetter-h" class="sec-h">{{ .Title }}</h1>
    <p class="lead">{{ T "wx_page_lead" }}</p>
  </div>
</section>
{{ partial "wind.html" (dict "page" . "full" true) }}
{{ partial "planer.html" . }}
<noscript><section class="sec page-sec"><div class="wrap"><p class="lead">{{ T "wx_page_lead" }}</p></div></section></noscript>
{{ end }}
