{{ define "main" }}
<section class="hero hero-page" aria-labelledby="wetter-h">
  <div class="hero-topo" aria-hidden="true"></div>
  <div class="wrap hero-in hero-mag">
    <p class="eyebrow">{{ T "wx_eyebrow" }}</p>
    <h1 id="wetter-h" class="hero-h">{{ .Title }}</h1>
    <p class="hero-tag">{{ T "wx_tag" }}</p>
    <p class="hero-text">{{ T "wx_page_lead" }}</p>
  </div>
</section>
{{ partial "wind.html" (dict "page" . "full" true) }}
{{ partial "planer.html" . }}
<noscript><section class="sec page-sec"><div class="wrap"><p class="lead">{{ T "wx_page_lead" }}</p></div></section></noscript>
{{ end }}
