baseURL                = "https://torben-jander.me/"
title                  = "Torben Jander"
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
enableRobotsTXT        = true
disableKinds           = ["taxonomy", "term", "rss"]
timeZone               = "Europe/Berlin"

[languages]
  [languages.de]
    languageCode = "de-DE"
    languageName = "Deutsch"
    weight       = 1
    title        = "Bremen ist flach"
    [languages.de.params]
      description = "Gravel und Laufen rund um Bremen, von Torben Jander. Echte Zahlen aus Strava: Kilometer, Höhenmeter, Touren zum Nachfahren, Ausrüstung."
  [languages.en]
    languageCode = "en-GB"
    languageName = "English"
    weight       = 2
    title        = "Bremen ist flach"
    [languages.en.params]
      description = "Gravel and running around Bremen, by Torben Jander. Real numbers from Strava: kilometres, climbing, rides to follow, gear."

[params]
  name     = "Torben Jander"
  marke    = "Bremen ist flach"   # groß oben links in der Navigation, der Name steht klein darunter
  ort      = "Bremen"
  email    = "torbenjander@icloud.com"
  strava   = "https://www.strava.com/athletes/165488129"
  github   = "https://github.com/jandertorben"
  linkedin = "https://www.linkedin.com/in/torben-jander-6a7199128/"
  youtube  = "https://www.youtube.com/@TorbenJander"
  tiktok   = "https://www.tiktok.com/@breity79"
  # Einladung zur Community. Nur im Community-Abschnitt, nicht in sameAs.
  whatsapp_community = "https://chat.whatsapp.com/EF7EvsZqAF15vB4CjHzQUY"
  # Strava-Club „Bremen ist flach“
  strava_club = "https://www.strava.com/clubs/2156230"
  # Partner, den Torben unterstützt. Steht sichtbar im Community-Abschnitt der Startseite.
  [params.partner]
    name  = "Battlefield Cyclists"
    url   = "https://battlefield-cyclists.de"
    claim = "Remember. Ride. Unite."
    logo  = "battlefield-cyclists.png"   # liegt in assets/img/partner/, mit Freigabe von Battlefield Cyclists
  # Richtwert, ab dem Laufschuhe üblicherweise getauscht werden (km)
  schuhLebensdauer = 800
  # Jahresziele in Kilometern
  [params.ziele]
    rad  = 2000
    lauf = 300

[markup.goldmark.renderer]
  unsafe = true
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[minify]
  minifyOutput = true
  [minify.tdewolff.html]
    keepQuotes = true

[outputs]
  home    = ["HTML"]
  page    = ["HTML"]
  section = ["HTML"]
