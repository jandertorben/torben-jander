baseURL                = "https://torben-jander.me/"
title                  = "Torben Jander"
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
enableRobotsTXT        = true
disableKinds           = ["taxonomy", "term", "rss"]
timeZone               = "Europe/Berlin"

[languages]
  [languages.de]
    languageCode = "de-DE"
    languageName = "Deutsch"
    weight       = 1
    title        = "Torben Jander – Laufen & Gravel aus Bremen"
    [languages.de.params]
      description = "Torben Jander läuft und fährt Gravel rund um Bremen. Echte Zahlen aus Strava: Kilometer, Höhenmeter, Routen, Ausrüstung."
  [languages.en]
    languageCode = "en-GB"
    languageName = "English"
    weight       = 2
    title        = "Torben Jander – Running & Gravel from Bremen"
    [languages.en.params]
      description = "Torben Jander runs and rides gravel around Bremen. Real numbers from Strava: kilometres, climbing, routes, gear."

[params]
  name     = "Torben Jander"
  ort      = "Bremen"
  email    = "torbenjander@icloud.com"
  strava   = "https://www.strava.com/athletes/165488129"
  github   = "https://github.com/jandertorben"
  linkedin = "https://www.linkedin.com/in/torben-jander-6a7199128/"
  youtube  = "https://www.youtube.com/@TorbenJander"
  tiktok   = "https://www.tiktok.com/@breity79"
  # Einladung zur Community. Nur im Community-Abschnitt, nicht in sameAs.
  whatsapp_community = "https://chat.whatsapp.com/EF7EvsZqAF15vB4CjHzQUY"
  # Richtwert, ab dem Laufschuhe üblicherweise getauscht werden (km)
  schuhLebensdauer = 800
  # Jahresziele in Kilometern
  [params.ziele]
    rad  = 2000
    lauf = 300

[markup.goldmark.renderer]
  unsafe = true

[minify]
  minifyOutput = true
  [minify.tdewolff.html]
    keepQuotes = true

[outputs]
  home    = ["HTML"]
  page    = ["HTML"]
  section = ["HTML"]
