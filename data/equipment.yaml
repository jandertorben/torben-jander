# Ausrüstung für die Rubrik „Ausrüstung“ auf der Startseite.
# Reihenfolge = Reihenfolge auf der Seite. Felder:
#   name, brand        Pflicht
#   category           bike | run | both   (bestimmt Farbe und Rubrik-Label)
#   strava_gear        Strava-Gear-ID → Kilometer werden automatisch aus data/strava.json gezogen
#   life_km            Richtwert für Lebensdauer (Laufschuhe), zeigt eine Füllanzeige
#   note_de, note_en   ein Satz, warum genau dieses Teil
#   spec               kurze Zeile mit Fakten (Gewicht, Reifen, Modelljahr …), optional
#   image              Dateiname in assets/img/, optional
#   photo              true = Bild als gerahmtes Foto zeigen statt als freigestelltes Objekt
#   size               small = Bild kleiner zeigen (für kleine Vorlagen, damit nichts hochgerechnet wird)
#   featured           true = großes Element mit Bild oben in der Rubrik
items:
  - name: Grizl
    brand: Canyon
    category: bike
    featured: true
    image: bike.png
    strava_gear: "16232514"
    spec: "Gravel · 11 kg"
    note_de: "Pendelrad und Wochenendmaschine in einem. Fährt fast jeden Tag, egal ob Deich oder Bürgersteig."
    note_en: "Commuter and weekend machine in one. Rides almost every day, dyke or pavement."
  - name: Edge 1040
    brand: Garmin
    category: bike
    image: garmin-edge-1040.png
    spec: "Radcomputer"
    note_de: "Zeigt unterwegs Strecke und Tempo und schickt jede Fahrt direkt zu Strava. Daher stimmen die Zahlen auf dieser Seite."
    note_en: "Shows route and pace on the go and sends every ride straight to Strava. That is why the numbers on this page add up."
  - name: Fenix 8
    brand: Garmin
    category: both
    image: garmin-fenix-8.png
    spec: "Sportuhr"
    note_de: "Läuft beim Laufen mit, zeichnet auf dem Rad parallel zum Edge auf und zählt dazwischen die Tage. Puls, Schlaf, Erholung, alles an einem Ort."
    note_en: "Comes along on every run, records alongside the Edge on the bike and counts the days in between. Heart rate, sleep, recovery, all in one place."
  - name: Speed Sensor 2 & Trittfrequenzsensor 2
    brand: Garmin
    category: bike
    image: garmin-sensoren.png
    photo: true
    spec: "Sensoren · Nabe & Kurbel"
    note_de: "Sitzen an Nabe und Kurbel und liefern dem Edge Geschwindigkeit und Trittfrequenz, auch wenn das GPS unter Bäumen schwächelt."
    note_en: "Sit on the hub and the crank and feed speed and cadence to the Edge, even when GPS struggles under trees."
  - name: RCR-R 900 Mips
    brand: Van Rysel
    category: bike
    image: van-rysel-rcr-r900.png
    spec: "Helm · Mips · Weiß"
    note_de: "Leicht, gut belüftet, mit Mips-System gegen Rotationskräfte. Weiß, damit man mich auf dem Deich auch im Gegenlicht sieht."
    note_en: "Light, well ventilated, Mips protection against rotational forces. White, so I show up on the dyke even against the light."
  - name: Perf 900 UCI World Tour
    brand: Van Rysel
    category: bike
    image: brille.png
    size: small
    spec: "Brille · Kategorie 3 · Weiß"
    note_de: "Großes Glas, kein Rahmen im Blickfeld. Hält Wind, Mücken und Schotter von den Augen fern."
    note_en: "Big lens, no frame in the field of view. Keeps wind, midges and gravel out of my eyes."
  - name: Perf 500 Light
    brand: Van Rysel
    category: bike
    image: brille-perf-500.png
    spec: "Brille · photochrom · Kategorie 1 bis 3"
    note_de: "Die Brille für früh morgens und trübe Tage: Das Glas tönt sich mit dem Licht selbst. Auf dem Weg zur Arbeit um sechs ist das Gold wert."
    note_en: "The glasses for early mornings and grey days: the lens tints itself with the light. On the six o'clock commute that is worth gold."
  - name: XC3
    brand: Shimano
    category: bike
    image: shimano-xc3.png
    spec: "Gravel-Schuh · BOA"
    note_de: "Steife Sohle für die Kraft, griffiges Profil für die Schiebepassagen. Der BOA-Drehverschluss sitzt auch mit Handschuhen."
    note_en: "Stiff sole for power, grippy tread for the hike-a-bike bits. The BOA dial works even with gloves on."
  - name: Novus Boost EVO Gravel Superflow
    brand: Selle Italia
    category: bike
    image: selle-italia-novus.png
    spec: "Sattel · Gravel"
    note_de: "Kurze Nase, breiter Ausschnitt, für lange Tage auf Schotter gemacht. Nach hundert Kilometern merkt man den Unterschied."
    note_en: "Short nose, wide cut-out, built for long days on gravel. After a hundred kilometres you notice the difference."
  - name: Icon Gravel Bibshorts
    brand: Bioracer
    category: bike
    image: bib-icon-gravel.png
    spec: "Trägerhose · Gravel"
    note_de: "Die Hose für alles ab einer Stunde im Sattel. Polster, das auch nach dem Deich noch Freude macht."
    note_en: "The shorts for anything over an hour in the saddle. A pad that still feels good after the dyke."
  - name: Tour of Honor 2026
    brand: Battlefield Cyclists
    category: bike
    image: trikot-tour-of-honor.png
    spec: "Trikot · Good Friday Battle 2026"
    note_de: "Das Trikot der Battlefield Cyclists zur Tour of Honor 2026. Auf dem Rücken stehen die Namen derer, für die gefahren wird. Kein Trikot für Bestzeiten, eins fürs Erinnern."
    note_en: "The Battlefield Cyclists jersey for the Tour of Honor 2026. The back carries the names of those it is ridden for. Not a jersey for personal bests, one for remembering."
  - name: Gel-Kayano 32
    brand: ASICS
    category: run
    image: asics-gel-kayano-32.png
    strava_gear: "31334309"
    life_km: 800
    note_de: "Der neue Schuh für die langen, langsamen Runden. Viel Dämpfung, wenig Diskussion."
    note_en: "The new shoe for the long, slow loops. Plenty of cushioning, no arguments."
  - name: Supernova Solution 2
    brand: Adidas
    category: run
    image: adidas-supernova.png
    strava_gear: "29620084"
    life_km: 800
    note_de: "Der erste ernsthafte Laufschuh. Hat die ersten hundert Kilometer getragen und trägt weiter."
    note_en: "The first serious running shoe. Carried the first hundred kilometres and keeps going."
  - name: Laufweste mit Soft Flask
    brand: Salomon
    category: run
    image: salomon-weste.png
    note_de: "Ab zehn Kilometern kommt sie mit. Wasser, Schlüssel, Handy, nichts wackelt."
    note_en: "Comes along from ten kilometres up. Water, keys, phone, nothing bounces."
