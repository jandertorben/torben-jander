name: Reparaturstationen aus OpenStreetMap

on:
  schedule:
    - cron: "41 3 * * 1"      # montags 03:41 UTC
  workflow_dispatch:
  push:
    paths:
      - "scripts/osm_repair.py"
      - ".github/workflows/osm.yml"

permissions:
  contents: write

concurrency:
  group: osm-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stationen holen
        run: python3 scripts/osm_repair.py
      - name: Änderungen committen
        run: |
          git config user.name "osm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reparatur.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "data: Reparaturstationen vom $(date -u +%Y-%m-%d)"
            git push
          fi
