    url: https://www.bioracer.com
  - name: Radschlag Bremen
    url: https://www.radschlag-bremen.de
  - name: Hammerhead
    url: https://www.hammerhead.io
  - name: Van Rysel
    url: https://www.vanryselcycling.com
  - name: Battlefield Cyclists
    url: https://battlefield-cyclists.de
