# Apps, die ich gebaut habe. Reihenfolge = Reihenfolge auf der Seite.
# icon: Datei unter assets/img/apps/ (quadratisch, mind. 180 px). Ohne icon erscheint der Anfangsbuchstabe.
# appstore / website: leer lassen, dann wird der Button nicht angezeigt.
items:
  - name: TidTil
    icon: tidtil.png
    platform: iPhone
    tagline_de: Der ruhige Familienkalender
    tagline_en: The calm family calendar
    text_de: >-
      Gemeinsame und private Termine der Familie auf einen Blick, ohne Aufgabenlisten, Chats und Funktionsballast.
      Öffnen und sehen, was heute ansteht. Termine lassen sich Familienmitgliedern zuordnen, auch Kindern ohne eigenes Gerät.
    text_en: >-
      Shared and private family events at a glance, without task lists, chats or feature overload.
      Open it and see what's happening today. Events can be assigned to family members, including children without their own device.
    appstore: https://apps.apple.com/app/id6780019857
    website: https://tidtil.app/

  - name: VeloCue
    icon: velocue.svg
    platform: iOS & Android
    tagline_de: Routen planen. Menschen treffen.
    tagline_en: Plan routes. Meet people.
    text_de: >-
      Die Feierabendrunde, ein neuer Anstieg oder einfach zum besten Kaffee.
      Mit VeloCue planst du deine Route und findest Leute, die mitfahren. Kostenlos für iOS und Android.
    text_en: >-
      An after-work loop, a new climb or just a ride to the best coffee.
      VeloCue lets you plan your route and find people to ride with. Free for iOS and Android.
    appstore: ""
    website: https://velocue.com/
