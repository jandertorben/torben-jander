# Marken im Laufband (Startseite, zwischen „Community“ und „Über mich“).
# Reihenfolge = Reihenfolge im Band. Einen Eintrag entfernen oder ergänzen reicht, der Rest passt sich an.
# name: wird als Schriftzug gesetzt (Barlow Condensed). Keine Fremd-Logos, daher keine Markenrechts-Fragen.
# url:  optional. Mit Link öffnet ein Klick die Seite in einem neuen Tab, und das Band bleibt stehen.
# logo: optional. Dateiname unter assets/img/marken/ (SVG, einfarbig, besser mit Erlaubnis/Pressekit der Firma).
#       Ist logo gesetzt, wird das Logo statt des Schriftzugs gezeigt; der Name dient als Alt-Text.
items:
