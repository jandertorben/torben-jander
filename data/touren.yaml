"21083485183":
  title: "Erste Runde mit dem Storck"
  title_en: "First ride on the Storck"
  summary: "52 km zum Kennenlernen: die erste Ausfahrt mit dem neuen Storck Grix.2."
  slug: "erste-runde-storck"
  photo: "erste-runde-storck.jpg"
  photo_alt: "Lenker und Oberrohr des Storck Grix.2, dahinter die Weser im Sonnenlicht"
  gallery:
    - file: "erste-runde-storck-hafen.jpg"
      alt: "Kleiner Hafen in Achim mit Steganlagen hinter dem Deich, Herbstbäume"
    - file: "erste-runde-storck-deich.jpg"
      alt: "Blick über den Lenker auf einen Weg am Deichfuß, links Bäume im Herbstlaub"
  text: |
    Die erste Ausfahrt mit dem neuen Storck Grix.2. Ein Novembermorgen, 52 Kilometer, 158 Höhenmeter, also Bremer Normalprogramm.

    Genau richtig für den Anfang: Nichts lenkt ab, kein Berg verlangt etwas. Man merkt nur, wie das Rad rollt, wie es lenkt und wie es sich auf Schotter anfühlt. Viel Zeit zum Hinhören, wenig Grund zum Absteigen.

    Einmal abgestiegen bin ich doch: für ein Foto am kleinen Hafen in Achim, an der Weser, wo die Boote liegen.
  text_en: |
    The first ride on the new Storck Grix.2. A November morning, 52 kilometres, 158 metres of climbing, so the usual Bremen programme.

    Just right for a start: nothing distracts, no hill asks for anything. You only notice how the bike rolls, how it steers and how it feels on gravel. Plenty of time to listen, little reason to get off.

    I did get off once: for a photo at the small harbour in Achim, on the Weser, where the boats are moored.

"20909029808":
  title: "Südschleife über Syke"
  summary: "60 km Feldwege und ruhige Nebenstraßen südlich von Bremen. Wendepunkt ist Syke."
  slug: "suedschleife-syke"
  photo: "suedschleife-syke.jpg"
  photo_alt: "Gravelbike an einem Baum am Feldrand, im Herbst. Eingeblendet: 60,54 km, 3:04 h, 19,74 km/h, 217 Höhenmeter, 10 Grad."
  text: |
    Die Runde startet in Bremen-Süd und führt über Weyhe nach Syke. Auf der Westseite geht es in einem weiten Bogen zurück nach Norden. Schon nach wenigen Kilometern wird es ruhig: Felder, Gräben, lange gerade Wege.

    Gut 200 Höhenmeter auf 60 km, für Bremer Verhältnisse fast hügelig. Steil wird es nirgends.

    Bei Wind lohnt es sich, die Richtung so zu wählen, dass er auf dem Rückweg von hinten kommt.

"20254852185":
  title: "Weserrunde über Thedinghausen"
  summary: "52 km an der Weser entlang bis Thedinghausen und über Achim zurück."
  slug: "weserrunde-thedinghausen"
  text: |
    Von Bremen-Süd geht es über Dreye nach Südosten, die Weser immer in der Nähe. Riede und Thedinghausen markieren den äußersten Punkt der Runde.

    Zurück führt der Weg über Achim, Mahndorf und Hemelingen. Viel offene Fläche, viel Himmel und an windigen Tagen ehrliche Arbeit.

"20023559115":
  title: "Feierabendschleife Weyhe"
  summary: "30 km am Abend: durch Weyhe und am Weserdeich zurück."
  slug: "feierabendschleife-weyhe"
  text: |
    Eine Runde für nach der Arbeit. Über Leeste und Kirchweyhe nach Süden, dann über Dreye an den Weserdeich und auf ihm zurück Richtung Stadt.

    Flach, zügig und in gut einer Stunde gefahren.

"19864658336":
  title: "Kleine Runde über Heiligenrode"
  summary: "20 km zwischen Brinkum, Heiligenrode und Weyhe, zum Schluss am Deich."
  slug: "runde-heiligenrode"
  text: |
    Eine kurze Schleife durch die Dörfer südlich von Bremen: Brinkum, Heiligenrode, Kirchweyhe. Von Dreye aus geht es am Weserdeich zurück.

    Passt in einen freien Nachmittag.

"19667015457":
  title: "Deichrunde Weyhe"
  summary: "16 km kurz und flach: durch Weyhe und am Weserdeich zurück."
  slug: "deichrunde-weyhe"
  text: |
    Die kürzeste Runde hier. Über Leeste und Kirchweyhe, dann an den Deich bei Dreye und an der Weser entlang zurück.

    Gut für den Einstieg oder eine schnelle Stunde draußen.
