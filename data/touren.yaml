"20909029808":
  title: "Südschleife über Syke"
  summary: "60 km Feldwege und ruhige Nebenstraßen südlich von Bremen. Wendepunkt ist Syke."
  slug: "suedschleife-syke"
  photo: "suedschleife-syke.jpg"
  photo_alt: "Gravelbike an einem Baum am Feldrand, im Herbst. Eingeblendet: 60,54 km, 3:04 h, 19,74 km/h, 217 Höhenmeter, 10 Grad."
  text: |
    Die Runde startet in Bremen-Süd und führt über Weyhe nach Syke. Auf der Westseite geht es in einem weiten Bogen zurück nach Norden. Schon nach wenigen Kilometern wird es ruhig: Felder, Gräben, lange gerade Wege.

    Gut 200 Höhenmeter auf 60 km, für Bremer Verhältnisse fast hügelig. Steil wird es nirgends.

    Bei Wind lohnt es sich, die Richtung so zu wählen, dass er auf dem Rückweg von hinten kommt.

"20254852185":
  title: "Weserrunde über Thedinghausen"
  summary: "52 km an der Weser entlang bis Thedinghausen und über Achim zurück."
  slug: "weserrunde-thedinghausen"
  photo: "weserrunde-thedinghausen.jpg"
  photo_kind: "plakat"   # grafisches Tourplakat, kein Foto – durch echtes Foto ersetzen
  photo_alt: "Tourplakat mit Streckenverlauf, Höhenprofil und Kennzahlen der Runde"
  text: |
    Von Bremen-Süd geht es über Dreye nach Südosten, die Weser immer in der Nähe. Riede und Thedinghausen markieren den äußersten Punkt der Runde.

    Zurück führt der Weg über Achim, Mahndorf und Hemelingen. Viel offene Fläche, viel Himmel und an windigen Tagen ehrliche Arbeit.

"20023559115":
  title: "Feierabendschleife Weyhe"
  summary: "30 km am Abend: durch Weyhe und am Weserdeich zurück."
  slug: "feierabendschleife-weyhe"
  photo: "feierabendschleife-weyhe.jpg"
  photo_kind: "plakat"   # grafisches Tourplakat, kein Foto – durch echtes Foto ersetzen
  photo_alt: "Tourplakat mit Streckenverlauf, Höhenprofil und Kennzahlen der Runde"
  text: |
    Eine Runde für nach der Arbeit. Über Leeste und Kirchweyhe nach Süden, dann über Dreye an den Weserdeich und auf ihm zurück Richtung Stadt.

    Flach, zügig und in gut einer Stunde gefahren.

"19864658336":
  title: "Kleine Runde über Heiligenrode"
  summary: "20 km zwischen Brinkum, Heiligenrode und Weyhe, zum Schluss am Deich."
  slug: "runde-heiligenrode"
  photo: "runde-heiligenrode.jpg"
  photo_kind: "plakat"   # grafisches Tourplakat, kein Foto – durch echtes Foto ersetzen
  photo_alt: "Tourplakat mit Streckenverlauf, Höhenprofil und Kennzahlen der Runde"
  text: |
    Eine kurze Schleife durch die Dörfer südlich von Bremen: Brinkum, Heiligenrode, Kirchweyhe. Von Dreye aus geht es am Weserdeich zurück.

    Passt in einen freien Nachmittag.

